<div class="header">
  <h1 class="page-title">Clientes</h1>
  <button mat-flat-button color="primary" (click)="abrirNuevo()">
    <mat-icon>add</mat-icon>
    Nuevo cliente
  </button>
</div>

<mat-card>
  <table mat-table [dataSource]="clientes" class="mat-elevation-z0">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let c">{{ nombreCompleto(c) }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let c">{{ c.email }}</td>
    </ng-container>
    <ng-container matColumnDef="telefono">
      <th mat-header-cell *matHeaderCellDef>Teléfono</th>
      <td mat-cell *matCellDef="let c">{{ c.telefono }}</td>
    </ng-container>
    <ng-container matColumnDef="cuit">
      <th mat-header-cell *matHeaderCellDef>CUIT</th>
      <td mat-cell *matCellDef="let c">{{ c.cuit }}</td>
    </ng-container>
    <ng-container matColumnDef="direccion">
      <th mat-header-cell *matHeaderCellDef>Dirección</th>
      <td mat-cell *matCellDef="let c">{{ c.direccion }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let c">
        <button mat-icon-button color="primary" (click)="abrirEditar(c)" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminar(c)" matTooltip="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>

  @if (!loading && clientes.length === 0) {
    <div class="empty">No hay clientes cargados.</div>
  }
</mat-card>
